[[rules]]
id = "database-engine"
description = "Database Engine"
regex = '''DB_ENGINE[=]["'\s]*[a-zA-Z0-9]+'''
tags = ["dbengine"]

[[rules]]
id = "database-name"
description = "Database Name"
regex = '''DB_NAME[=]["'\s]*[a-zA-Z0-9-_\.]+'''
tags = ["dbname"]

[[rules]]
id = "database-user"
description = "Database User"
regex = '''DB_USERNAME[=]["'\s]*[a-zA-Z0-9-_.]+'''
tags = ["dbuser"]

[[rules]]
id = "database-password"
description = "Database Password"
regex = '''DB_PASSWORD[=]["'\s]*[a-zA-Z0-9-_.]+'''
tags = ["dbpassword"]

[[rules]]
id = "database-host"
description = "Database Host"
regex = '''DB_HOST[=]["'\s]*[a-zA-Z0-9-_.]+'''
tags = ["dbhost"]

[[rules]]
id = "database-port"
description = "Database Port"
regex = '''DB_PORT[=]["'\s]*[0-9]{1,5}'''
tags = ["dbport"]

[[rules]]
id = "api-key"
description = "API Key"
regex = '''API_KEY[=]["'\s]*[a-zA-Z0-9-_.]+'''
tags = ["apikey"]

[[rules]]
id = "feature-names"
description = "Feature Names"
regex = '''FEATURE_NAMES[=]["'\s]*[a-zA-Z0-9-_.]+'''
tags = ["featurenames"]

[[rules]]
id = "hyperparameter-c"
description = "Hyperparameter C"
regex = '''HYPERPARAM_C[=]["'\s]*[0-9.]+'''
tags = ["hyperparamc"]

[[rules]]
id = "test-size"
description = "Test Size"
regex = '''TEST_SIZE[=]["'\s]*[0-9.]+'''
tags = ["testsize"]

[[rules]]
id = "random-state"
description = "Random State"
regex = '''RANDOM_STATE[=]["'\s]*[0-9]+'''
tags = ["randomstate"]