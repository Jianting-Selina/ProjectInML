<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - Brain Tumor Detection System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .nav {
            background: #333;
            padding: 10px;
            margin-bottom: 20px;
        }
        .nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="patient-register.html">Register Patient</a>
            <a href="patient-list.html">Patient List</a>
            <a href="detection.html">AI Detection</a>
        </div>
        
        <h1>Patient Registration</h1>
        
        <form id="patientForm">
            <div class="form-group">
                <label for="patientId">Patient ID</label>
                <input type="text" id="patientId" name="patientId" placeholder="Auto-generated" readonly>
            </div>
            
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="age">Age *</label>
                <input type="number" id="age" name="age" required>
            </div>
            
            <div class="form-group">
                <label for="gender">Gender *</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="phone">Contact Number *</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            
            <div class="form-group">
                <label for="symptoms">Symptoms Description</label>
                <input type="text" id="symptoms" name="symptoms">
            </div>
            
            <button type="submit">Submit Registration</button>
        </form>
    </div>

    <script>
       document.getElementById('patientForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Get form data
    const name = document.getElementById('name').value;
    const age = document.getElementById('age').value;
    const gender = document.getElementById('gender').value;
    const phone = document.getElementById('phone').value;
    const symptoms = document.getElementById('symptoms').value;
    
    // Create patient object
    const patient = {
        name: name,
        age: age,
        gender: gender,
        phone: phone,
        symptoms: symptoms,
        registrationDate: new Date().toISOString().split('T')[0]
    };
    
    // Send data to backend API
    fetch('http://127.0.0.1:5000/api/patients', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(patient)
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(data => {
        // Assuming the API returns the patient object with an ID
        alert('Patient registered successfully! Patient ID: ' + data.id);
        
        // Reset form
        document.getElementById('patientForm').reset();
        
        // Optionally display the patient ID somewhere on the page
        if (document.getElementById('patientId')) {
            document.getElementById('patientId').value = data.id;
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error registering patient. Please try again.');
    });
});
    </script>
</body>
</html>
