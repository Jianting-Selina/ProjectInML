<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient List - Brain Tumor Detection System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .nav {
            background: #333;
            padding: 10px;
            margin-bottom: 20px;
        }

        .nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .action-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-input {
            padding: 8px;
            width: 70%;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .search-btn {
            padding: 8px 15px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav">
            <a href="/api/patients/list">Home</a>
            <a href="/api/patients/form">Register Patient</a>
            <a href="/api/patients/list">Patient List</a>
            <a href="/api/patients/list">AI Detection</a>
        </div>

        <h1>Patient List</h1>

        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by name">
            <button class="search-btn" onclick="searchPatients()">Search</button>
        </div>

        <table id="patientTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Contact</th>
                    <th>Registration Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="patientsList">
                <!-- Patients will be dynamically loaded here -->
            </tbody>
        </table>
    </div>

    <script>

        // Load patients when page loads
        window.onload = function () {
            loadPatients();
        };

        // Load patient list
        function loadPatients() {
            const tableBody = document.getElementById('patientsList');
            tableBody.innerHTML = '';

            fetch('/api/patients/', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
                .then(response => {
                    console.log('Response status:', response.status); // 打印状态码
                    console.log('Response ok:', response.ok); // 打印 ok 状态
                    return response.json(); // 直接解析 JSON
                })
                .then(data => {
                    console.log('Received data:', data); // 打印接收的数据
                    const patients = data; // 可能不需要 data.patients

                    if (patients.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No patient data available</td></tr>';
                        return;
                    }

                    patients.forEach(patient => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                <td>${patient.name}</td>
                <td>${patient.age}</td>
                <td>${patient.gender === 'male' ? 'Male' : 'Female'}</td>
                <td>${patient.phone}</td>
                <td>${patient.registration_date}</td>
                <td>
                    <button class="action-btn" onclick="viewPatient('${patient.patient_id}')">View</button>
                    <button class="action-btn" onclick="startDetection('${patient.patient_id}')">Detect</button>
                </td>
            `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Error fetching patients:', error);
                    alert('network error');
                });
        }

        // Search patients
        function searchPatients() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const tableBody = document.getElementById('patientsList');

            // Use demo data for searching (in real app, this would come from API)
            const filteredPatients = DEMO_PATIENTS.filter(patient =>
                patient.name.toLowerCase().includes(searchTerm)
            );

            // Clear table
            tableBody.innerHTML = '';

            if (filteredPatients.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No matching results found</td></tr>';
                return;
            }

            // Fill table with filtered patients
            filteredPatients.forEach(patient => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${patient.name}</td>
                    <td>${patient.age}</td>
                    <td>${patient.gender === 'male' ? 'Male' : 'Female'}</td>
                    <td>${patient.phone}</td>
                    <td>${patient.registrationDate}</td>
                    <td>
                        <button class="action-btn" onclick="viewPatient('${patient.id}')">View</button>
                        <button class="action-btn" onclick="startDetection('${patient.id}')">Detect</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // View patient details
        function viewPatient(patientId) {
            // In a real application, this would navigate to a detailed patient view
            alert(`Viewing details for Patient ID: ${patientId}`);
        }

        // Go to AI detection page
        function startDetection(patientId) {
            try {
                // Construct the URL with multiple patient details
                const detectionUrl = `/api/patients/${encodeURIComponent(patientId)}/detection`;

                // Navigate to the detection page
                window.location.href = detectionUrl;
            } catch (error) {
                console.error('Error starting detection:', error);
                alert('Failed to start detection. Please try again.');
            }
        }
    </script>
</body>

</html>
