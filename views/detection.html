<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Detection - Brain Tumor Detection System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #333;
            text-align: center;
        }
        .nav {
            background: #333;
            padding: 10px;
            margin-bottom: 20px;
        }
        .nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }
        .patient-info {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
        .upload-section {
            margin-bottom: 20px;
            text-align: center;
        }
        .preview-section {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .preview-box {
            width: 45%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
        }
        #imagePreview, #resultPreview {
            max-width: 100%;
            height: auto;
            max-height: 200px;
            margin-top: 10px;
        }
        .buttons {
            text-align: center;
            margin-top: 20px;
        }
        button {
            padding: 10px 15px;
            margin: 0 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .detect-btn {
            background: #4CAF50;
            color: white;
        }
        .report-btn {
            background: #2196F3;
            color: white;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result-section {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: none;
        }
        .result-positive {
            background-color: #ffebee;
            border-left: 5px solid #f44336;
        }
        .result-negative {
            background-color: #e8f5e9;
            border-left: 5px solid #4caf50;
        }
        .info-row {
            display: flex;
            margin-bottom: 5px;
        }
        .info-label {
            width: 120px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="patient-register.html">Register Patient</a>
            <a href="patient-list.html">Patient List</a>
            <a href="detection.html">AI Detection</a>
        </div>
        
        <h1>Brain Tumor AI Detection</h1>
        
        <div id="patientInfoSection" class="patient-info">
            <h2>Patient Information</h2>
            <div class="info-row">
                <span class="info-label">Patient ID:</span>
                <span id="patientId">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Name:</span>
                <span id="patientName">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Age:</span>
                <span id="patientAge">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Gender:</span>
                <span id="patientGender">-</span>
            </div>
        </div>
        
        <div class="upload-section">
            <h2>Upload MRI Image</h2>
            <input type="file" id="imageUpload" accept="image/*">
        </div>
        
        <div class="preview-section">
            <div class="preview-box">
                <h3>Original Image</h3>
                <img id="imagePreview" src="/api/placeholder/200/150" alt="Image preview">
            </div>
            <div class="preview-box">
                <h3>AI Analysis</h3>
                <img id="resultPreview" src="/api/placeholder/200/150" alt="Result preview">
            </div>
        </div>
        
        <div class="loader" id="loader"></div>
        
        <div class="result-section" id="resultSection">
            <h2>Detection Results</h2>
            <div class="info-row">
                <span class="info-label">Diagnosis:</span>
                <span id="diagnosisResult">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Confidence:</span>
                <span id="confidenceLevel">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Tumor Type:</span>
                <span id="tumorType">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Location:</span>
                <span id="tumorLocation">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Size:</span>
                <span id="tumorSize">-</span>
            </div>
        </div>
        
        <div class="buttons">
            <button class="detect-btn" id="detectBtn">Start Detection</button>
            <button class="report-btn" id="reportBtn" disabled>Generate Report</button>
        </div>
    </div>

    <script>
        // Get patient ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('id');
        
        // Load patient data when page loads
        window.onload = function() {
            if (patientId) {
                loadPatientData(patientId);
            }
            
            // Set up image upload preview
            document.getElementById('imageUpload').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        document.getElementById('imagePreview').src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            // Set up detection button
            document.getElementById('detectBtn').addEventListener('click', startDetection);
            
            // Set up report button
            document.getElementById('reportBtn').addEventListener('click', function() {
                window.location.href = `report.html?id=${patientId}`;
            });
        };
        
        // Load patient data
        function loadPatientData(id) {
            const patients = JSON.parse(localStorage.getItem('patients')) || [];
            const patient = patients.find(p => p.id === id);
            
            if (patient) {
                document.getElementById('patientId').textContent = patient.id;
                document.getElementById('patientName').textContent = patient.name;
                document.getElementById('patientAge').textContent = patient.age;
                document.getElementById('patientGender').textContent = patient.gender === 'male' ? 'Male' : 'Female';
            } else {
                alert('Patient not found');
            }
        }
        
        // Start AI detection
        function startDetection() {
            // Check if image is uploaded
            const imagePreview = document.getElementById('imagePreview');
            if (imagePreview.src.includes('placeholder')) {
                alert('Please upload an MRI image first');
                return;
            }
            
            // Show loader
            const loader = document.getElementById('loader');
            loader.style.display = 'block';
            
            // Disable detection button
            document.getElementById('detectBtn').disabled = true;
            
            // Simulate AI processing (in a real app, this would be an API call)
            setTimeout(function() {
                // Hide loader
                loader.style.display = 'none';
                
                // Randomly determine result for demo
                const hasTumor = Math.random() > 0.5;
                
                // Show result section
                const resultSection = document.getElementById('resultSection');
                resultSection.style.display = 'block';
                resultSection.className = hasTumor ? 
                    'result-section result-positive' : 
                    'result-section result-negative';
                
                // Update result data
                document.getElementById('diagnosisResult').textContent = hasTumor ? 
                    'Tumor Detected' : 'No Tumor Detected';
                document.getElementById('confidenceLevel').textContent = 
                    (75 + Math.floor(Math.random() * 20)) + '%';
                
                if (hasTumor) {
                    const tumorTypes = ['Glioma', 'Meningioma', 'Pituitary', 'Acoustic Neuroma'];
                    const locations = ['Frontal Lobe', 'Temporal Lobe', 'Parietal Lobe', 'Cerebellum'];
                    
                    document.getElementById('tumorType').textContent = 
                        tumorTypes[Math.floor(Math.random() * tumorTypes.length)];
                    document.getElementById('tumorLocation').textContent = 
                        locations[Math.floor(Math.random() * locations.length)];
                    document.getElementById('tumorSize').textContent = 
                        (Math.random() * 5 + 1).toFixed(1) + ' cm';
                    
                    // Update result preview with simulated tumor highlight
                    document.getElementById('resultPreview').src = imagePreview.src;
                } else {
                    document.getElementById('tumorType').textContent = 'N/A';
                    document.getElementById('tumorLocation').textContent = 'N/A';
                    document.getElementById('tumorSize').textContent = 'N/A';
                    document.getElementById('resultPreview').src = imagePreview.src;
                }
                
                // Enable report button
                document.getElementById('reportBtn').disabled = false;
                
                // Save result to localStorage
                saveDetectionResult(patientId, {
                    date: new Date().toISOString(),
                    hasTumor: hasTumor,
                    confidence: document.getElementById('confidenceLevel').textContent,
                    tumorType: document.getElementById('tumorType').textContent,
                    tumorLocation: document.getElementById('tumorLocation').textContent,
                    tumorSize: document.getElementById('tumorSize').textContent,
                    imageSrc: imagePreview.src
                });
            }, 3000);
        }
        
        // Save detection result
        function saveDetectionResult(patientId, result) {
            // Get existing results or create new
            let results = JSON.parse(localStorage.getItem('detectionResults')) || {};
            
            // Add result to patient
            results[patientId] = result;
            
            // Save to localStorage
            localStorage.setItem('detectionResults', JSON.stringify(results));
        }
        
    </script>
</body>
</html>
